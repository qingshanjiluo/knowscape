[package]
name = "cloud-parsers"
version = "0.1.0"
edition = "2021"
description = "Cloud-side document parsing — calls knowscape-parser binary or native Python libs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["rustls-tls"] }
tempfile = "3"

[features]
default = ["use-native"]
use-native = []  # Use Rust native parsing
use-python = []   # Call Python subprocess as fallback
